schema_version: "1.6"
repository_role: reference-research-canonical
canonical_branch: "main"

standard_source: project_source
standard_source_lock_path: "REFERENCE_RESEARCH_STANDARD_SOURCE_LOCK_v1.yaml"
repository_contract_addendum_path: "REFERENCE_RESEARCH_REPOSITORY_CONTRACT_v1.4_PROJECT_SOURCE_ADDENDUM.md"
sop_filename: "REFERENCE_RESEARCH_ANALYSIS_SOP_v7.1.md"
repository_contract_filename: "REFERENCE_RESEARCH_REPOSITORY_CONTRACT_v1.md"
work_model_schema_filename: "REFERENCE_WORK_MODEL_SCHEMA_v2.md"
anonymity_contract_path: "REFERENCE_RESEARCH_ANONYMITY_CONTRACT_v1.md"

works_registry_path: "registry/works.yaml"
source_inventory_path: "registry/source_inventory.yaml"
private_identity_map_path: "registry/private/work_identity_map.yaml"
recent_receipts_index_path: "indexes/recent_receipts.md"
scene_retrieval_contract_path: "indexes/scene_retrieval_contract.md"
expression_retrieval_path: "indexes/expression_retrieval.md"
prose_realization_retrieval_path: "indexes/prose_realization_retrieval.md"
initial_onboarding_research_path: "indexes/initial_onboarding_research.md"

authority_boundary:
  active_research_roots:
    - "registry/"
    - "works/"
    - "comparisons/"
    - "mc_candidates/"
    - "indexes/"
    - "audits/"
  legacy_non_authoritative_roots:
    - "catalog/"
    - "history/"
  historical_contract_paths:
    - "REFERENCE_RESEARCH_REPOSITORY_CONTRACT_v1.1_PROJECT_SOURCE_ADDENDUM.md"
    - "REFERENCE_RESEARCH_REPOSITORY_CONTRACT_v1.2_PROJECT_SOURCE_ADDENDUM.md"
    - "REFERENCE_RESEARCH_REPOSITORY_CONTRACT_v1.3_PROJECT_SOURCE_ADDENDUM.md"
  routing_policy:
    current_authority_from_manifest_only: true
    exclude_legacy_roots_from_default_research_search: true
    exclude_historical_contracts_from_bootstrap_authority: true
    legacy_content_may_be_read_for_history_only: true

identity_policy:
  default_exposure: sealed
  sealed_map_required: true
  derived_layers_allow_real_work_title: false
  commit_messages_allow_real_work_title: false

standard_verification_policy:
  require_filename_match: true
  require_sha256_match: true
  require_size_match: true
  require_contract_addendum: true
  mismatch_status: HOLD_STANDARD_SOURCE
