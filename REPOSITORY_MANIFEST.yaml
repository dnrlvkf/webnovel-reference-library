schema_version: "1.2"
repository_role: reference-research-canonical
canonical_branch: "main"

standard_source: project_source
standard_source_lock_path: "REFERENCE_RESEARCH_STANDARD_SOURCE_LOCK_v1.yaml"
sop_filename: "REFERENCE_RESEARCH_ANALYSIS_SOP_v6.md"
repository_contract_filename: "REFERENCE_RESEARCH_REPOSITORY_CONTRACT_v1.md"
work_model_schema_filename: "REFERENCE_WORK_MODEL_SCHEMA_v1.md"
anonymity_contract_path: "REFERENCE_RESEARCH_ANONYMITY_CONTRACT_v1.md"

works_registry_path: "registry/works.yaml"
source_inventory_path: "registry/source_inventory.yaml"
private_identity_map_path: "registry/private/work_identity_map.yaml"
recent_receipts_index_path: "indexes/recent_receipts.md"

identity_policy:
  default_exposure: sealed
  sealed_map_required: true
  derived_layers_allow_real_work_title: false
  commit_messages_allow_real_work_title: false

standard_verification_policy:
  require_filename_match: true
  require_sha256_match: true
  require_size_match: true
  mismatch_status: HOLD_STANDARD_SOURCE
